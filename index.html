<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2 Night</title>
<style>
:root{--bg:#04050B;--glass:rgba(255,255,255,.06);--line:rgba(212,175,55,.28);--gold:#D4AF37;--gold2:#F6DE8D;--blue:#1B5CFF;--wine:#8B1A3A;--mut:#9AA0B4}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,"Noto Sans Arabic","Noto Sans SC",sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 12% 8%,#1B5CFF55,transparent 42%),radial-gradient(circle at 95% 35%,#8B1A3A88,transparent 45%),radial-gradient(circle at 40% 105%,#D4AF3733,transparent 50%),#04050B}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(45deg,transparent 48.5%,rgba(212,175,55,.13) 49.5%,rgba(212,175,55,.13) 50.5%,transparent 51.5%),linear-gradient(-45deg,transparent 48.5%,rgba(212,175,55,.13) 49.5%,rgba(212,175,55,.13) 50.5%,transparent 51.5%);background-size:46px 46px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px}
.logo{font-weight:900;font-size:21px;letter-spacing:2px;background:linear-gradient(90deg,var(--gold2),var(--gold),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tr{display:flex;gap:6px;align-items:center}
.chip{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--gold2)}
select{background:#0b0e1c;color:var(--gold2);border:1px solid var(--line);border-radius:20px;padding:6px 8px;font-size:12px;outline:none}
.screen{display:none;flex:1;overflow-y:auto;padding:4px 16px 110px}
.screen.active{display:block;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-size:20px;margin:6px 0 2px;color:var(--gold2)}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;backdrop-filter:blur(14px)}
.btn{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#9c7a1c);color:#1a1200;border:none;padding:13px 18px;border-radius:26px;font-weight:800;cursor:pointer;width:100%;font-size:15px;box-shadow:0 6px 24px #D4AF3744}
.btn.ghost{background:var(--glass);color:#fff;border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;background:rgba(8,10,22,.8);border:1px solid var(--line);border-radius:30px;padding:8px;backdrop-filter:blur(20px);z-index:10}
.nav button{background:none;border:none;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:20px;cursor:pointer}
.nav button span{font-size:20px}
.nav button.active{color:var(--gold2);background:linear-gradient(135deg,#1B5CFF44,#8B1A3A66)}
#sky{width:100%;height:290px;border-radius:26px;display:block;border:1px solid var(--line);background:#02040a}
.hud{display:flex;justify-content:space-between;margin:10px 0;font-size:12px;color:var(--mut)}
.hud b{display:block;color:var(--gold2);font-size:18px}
.dests{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.dest{flex:0 0 auto;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:10px 14px;font-size:13px;cursor:pointer;color:#fff}
.dest.sel{border-color:var(--gold);background:#D4AF3722}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold),var(--wine))}
.avs{display:flex;margin:8px 0}
.avs span{width:34px;height:34px;border-radius:50%;background:#111530;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;margin-inline-end:-8px;font-size:18px}
.bub{background:var(--glass);border:1px solid var(--line);padding:10px 14px;border-radius:20px;margin:8px 0;max-width:85%;word-wrap:break-word}
.bub.me{margin-inline-start:auto;background:linear-gradient(135deg,#1B5CFF,#6D0F26);border-color:var(--gold)}
.bub small{display:block;opacity:.7;font-size:11px;margin-bottom:2px;color:var(--gold2)}
.kb{position:fixed;left:12px;right:12px;bottom:calc(136px + env(safe-area-inset-bottom,0px));display:none;gap:6px;align-items:center;z-index:9}
.kb.show,.chatbar.show{display:flex}
.keys{display:flex;gap:5px;overflow-x:auto;flex:1;padding:4px 0}
.keys button{flex:0 0 auto;min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#0b0e1c;color:var(--gold2);font-size:18px;cursor:pointer}
.chatbar{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));display:none;gap:8px;z-index:9}
.chatbar .btn{width:54px;padding:0}
input[type=text]{width:100%;padding:13px 16px;border-radius:26px;border:1px solid var(--line);background:rgba(8,10,22,.92);color:#fff;outline:none;font-size:15px}
#room{padding-bottom:210px}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.vi{height:130px;border-radius:18px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;color:var(--mut);font-size:13px}
.vi img{width:100%;height:100%;object-fit:cover}
.vi .del{position:absolute;top:6px;inset-inline-end:6px;background:#000a;color:#fff;border:none;border-radius:50%;width:26px;height:26px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border-radius:20px;border:1px solid var(--line);background:var(--glass);color:#fff;font-weight:700}
.tabs button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1200;border:none}
.pc{height:290px;border-radius:26px;background:linear-gradient(160deg,#0b2a8f,#4a0b1f);border:1px solid var(--gold);display:flex;flex-direction:column;justify-content:flex-end;padding:18px;position:relative;overflow:hidden}
.pc .em{position:absolute;top:28px;left:0;right:0;text-align:center;font-size:92px}
.pc h3{font-size:24px;color:var(--gold2)}.pc p{opacity:.85;font-size:13px}
.fut{display:flex;gap:12px;align-items:center}
.fut .ic{font-size:28px;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#1B5CFF44,#8B1A3A77);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.fut b{font-size:15px}.fut p{color:var(--mut);font-size:12px;margin-top:2px}
.tag{font-size:10px;background:var(--wine);border-radius:8px;padding:2px 7px;margin-inline-start:6px;vertical-align:middle}
.sw{margin-inline-start:auto;flex:0 0 auto;width:46px;height:26px;border-radius:14px;background:rgba(255,255,255,.15);position:relative;border:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--gold)}.sw.on::after{left:23px}
.nav button{padding:6px 6px;font-size:10px}
input[type=date]{padding:11px;border-radius:16px;border:1px solid var(--line);background:#0b0e1c;color:#fff;color-scheme:dark;min-width:0;outline:none}
.ov{position:fixed;inset:0;z-index:50;background:rgba(4,5,11,.97);display:none;flex-direction:column;justify-content:center;padding:24px;gap:12px;overflow-y:auto}
.ov.show{display:flex}
.bp{border:1px solid var(--gold);border-radius:20px;padding:14px;margin-bottom:12px;background:linear-gradient(135deg,#0b2a8f55,#4a0b1f88);position:relative}
.bp .rt{font-size:22px;font-weight:900;color:var(--gold2)}
.bp .dl{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fr .pr{color:var(--gold2);font-weight:800;font-size:17px;white-space:nowrap}
</style>
</head>
<body>
<div class="top">
  <div class="logo">💎 2 NIGHT</div>
  <div class="tr">
    <select id="lang" aria-label="Language"><option value="ha">Hausa</option><option value="en">English</option><option value="ar">العربية</option><option value="fr">Français</option><option value="zh">中文</option><option value="es">Español</option></select>
    <div class="chip" id="coin">₦0</div>
  </div>
</div>

<div id="fly" class="screen active">
  <h2 data-i="fly" data-e="🚀 "></h2>
  <p class="sub" data-i="flySub"></p>
  <canvas id="sky"></canvas>
  <div class="hud"><div><span data-i="loc"></span><b id="hLoc">Kano</b></div><div><span data-i="alt"></span><b id="hAlt">0 km</b></div><div><span data-i="spd"></span><b id="hSpd">0</b></div></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="dests" id="dests"></div>
  <button class="btn" id="goBtn" onclick="takeoff()"></button>
  <div class="glass" id="arrive" style="display:none;margin-top:12px">
    <b id="aTitle"></b><p class="sub" id="aSub" style="margin:4px 0"></p><div class="avs" id="aAvs"></div>
    <button class="btn ghost" onclick="joinPlace()" data-i="join" data-e="💬 "></button>
  </div>
</div>

<div id="room" class="screen">
  <h2 id="roomName"></h2>
  <p class="sub"><span style="color:var(--gold)">●</span> <span id="onl">1.2k</span> <span data-i="onl"></span></p>
  <div id="chatBox"></div>
</div>

<div id="vault" class="screen">
  <h2 data-i="vault" data-e="🔒 "></h2><p class="sub" data-i="vaultSub"></p>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
  <button class="btn" onclick="document.getElementById('fileInput').click()" data-i="add"></button>
  <div class="vg" id="vGrid"></div>
</div>

<div id="aure" class="screen">
  <h2 data-i="aure" data-e="💍 "></h2><p class="sub" data-i="aureSub"></p>
  <div class="tabs"><button id="tW" class="on" onclick="setG('w')" data-i="w"></button><button id="tM" onclick="setG('m')" data-i="m"></button></div>
  <div class="pc"><div class="em" id="pEm"></div><h3 id="pN"></h3><p id="pI"></p></div>
  <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="swipe(false)" data-i="skip" data-e="✖ "></button><button class="btn" onclick="swipe(true)" data-i="like" data-e="❤ "></button></div>
  <p class="sub" id="lk" style="text-align:center;margin-top:10px"></p>
</div>

<div id="future" class="screen">
  <h2 data-i="fut" data-e="✨ "></h2><p class="sub" data-i="futSub"></p>
  <div id="fList"></div>
  <div class="glass"><div class="fut"><div class="ic">💰</div><div><b>Earn</b><p data-i="earnD"></p></div></div>
  <div class="row"><button class="btn ghost" style="margin-top:10px" onclick="addEarn(500)" data-i="inv"></button><button class="btn ghost" style="margin-top:10px" onclick="addEarn(50)" data-i="ad"></button></div></div>
</div>

<div id="tix" class="screen">
 <h2 data-i="tix" data-e="✈️ "></h2><p class="sub" data-i="tixSub"></p>
 <div class="glass">
  <div class="row"><div style="flex:1"><div class="sub" style="margin:0 0 4px" data-i="from"></div><select id="fFrom" style="width:100%"></select></div><div style="flex:1"><div class="sub" style="margin:0 0 4px" data-i="to"></div><select id="fTo" style="width:100%"></select></div></div>
  <div class="row" style="margin-top:10px"><input type="date" id="fDate" style="flex:1"><select id="fCls"></select><select id="fPax"></select></div>
  <button class="btn" style="margin-top:12px" onclick="searchF()" data-i="search"></button>
 </div>
 <div id="fRes"></div>
 <h2 data-i="myT" data-e="🎫 "></h2><div id="fTix"></div>
 <p class="sub" data-i="fareNote"></p>
 <button class="chip" id="outBtn" onclick="logout()" style="cursor:pointer"></button>
</div>

<div class="ov" id="ov">
 <select id="lang2" style="align-self:flex-end"><option value="ha">Hausa</option><option value="en">English</option><option value="ar">العربية</option><option value="fr">Français</option><option value="zh">中文</option><option value="es">Español</option></select>
 <div class="logo" style="font-size:30px;text-align:center">💎 2 NIGHT</div>
 <h2 data-i="lgT" style="text-align:center"></h2>
 <div id="lgS1"><p class="sub" data-i="lgSub" style="text-align:center"></p>
  <div class="row"><select id="cc" style="max-width:112px"><option value="234">🇳🇬 +234</option><option value="227">🇳🇪 +227</option><option value="233">🇬🇭 +233</option><option value="229">🇧🇯 +229</option><option value="228">🇹🇬 +228</option><option value="237">🇨🇲 +237</option><option value="235">🇹🇩 +235</option><option value="249">🇸🇩 +249</option><option value="966">🇸🇦 +966</option><option value="971">🇦🇪 +971</option><option value="20">🇪🇬 +20</option><option value="33">🇫🇷 +33</option><option value="34">🇪🇸 +34</option><option value="44">🇬🇧 +44</option><option value="1">🇺🇸 +1</option><option value="86">🇨🇳 +86</option></select><input type="text" id="ph" inputmode="tel" placeholder="8012345678" autocomplete="tel" dir="ltr"></div>
  <button class="btn" style="margin-top:12px" onclick="sendOtp(false)" data-i="sendC"></button></div>
 <div id="lgS2" style="display:none"><p class="sub" style="text-align:center"><span data-i="codeSub"></span> <b id="lgPh" style="color:var(--gold2)" dir="ltr"></b></p>
  <div class="glass" id="demoB" style="font-size:12px;color:var(--gold2);word-break:break-all"></div>
  <input type="text" id="otpIn" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="text-align:center;letter-spacing:8px;font-size:22px" dir="ltr">
  <button class="btn" style="margin-top:12px" onclick="verifyOtp()" data-i="verify"></button>
  <div class="row"><button class="btn ghost" id="rsBtn" style="margin-top:8px" onclick="sendOtp(true)"></button><button class="btn ghost" style="margin-top:8px" onclick="showLogin()" data-i="change"></button></div></div>
 <p id="lgErr" style="color:#ff7a90;text-align:center;font-size:13px;min-height:18px"></p>
</div>

<div class="kb" id="kb"><select id="kbLang" aria-label="Keyboard"><option value="ha">⌨ Hausa</option><option value="en">⌨ English</option><option value="ar">⌨ العربية</option><option value="fr">⌨ Français</option><option value="zh">⌨ 中文</option><option value="es">⌨ Español</option></select><div class="keys" id="keys"></div></div>
<div class="chatbar" id="cbar"><input type="text" id="msg" dir="auto" autocomplete="off"><button class="btn" onclick="sendMsg()">➤</button></div>

<div class="nav">
  <button class="active" data-s="fly"><span>🚀</span><i data-i="nFly" style="font-style:normal"></i></button>
  <button data-s="room"><span>💬</span><i data-i="nChat" style="font-style:normal"></i></button>
  <button data-s="vault"><span>🔒</span><i data-i="nVault" style="font-style:normal"></i></button>
  <button data-s="aure"><span>💍</span><i data-i="nAure" style="font-style:normal"></i></button>
  <button data-s="tix"><span>✈️</span><i data-i="nTix" style="font-style:normal"></i></button>
  <button data-s="future"><span>✨</span><i data-i="nFut" style="font-style:normal"></i></button>
</div>

    cx.fillStyle='rgba(255,255,255,'+(.1*(1-ph*.8))+')';cx.beginPath();cx.ellipse(c.x*W,c.y*H,70*c.s*D,18*c.s*D,0,0,7);cx.fill()});

function rsTxt(){var b=document.getElementById('rsBtn');b.textContent=T('resend')+(cd>0?' ('+cd+')':'');b.disabled=cd>0}
function sendOtp(re){
  if(!re){var d=document.getElementById('ph').value.replace(/\D/g,'').replace(/^0+/,'');
    if(d.length<7||d.length>11){lgErr('badNum');return}
    fullPhone='+'+document.getElementById('cc').value+d}
  else if(cd>0)return;
  var a=new Uint32Array(1);crypto.getRandomValues(a);otp=String(100000+a[0]%900000);otpT=Date.now()+300000;tries=0;
  document.getElementById('lgS1').style.display='none';document.getElementById('lgS2').style.display='block';
  document.getElementById('lgPh').textContent=fullPhone;document.getElementById('demoB').textContent=T('demo')+' '+otp;
  document.getElementById('otpIn').value='';lgErr();
  cd=30;rsTxt();clearInterval(cdI);cdI=setInterval(function(){cd--;rsTxt();if(cd<=0)clearInterval(cdI)},1000);
}
function verifyOtp(){
  if(!otp||Date.now()>otpT){lgErr('expired');return}
  if(tries>=5){lgErr('tooMany');return}
  if(document.getElementById('otpIn').value.trim()===otp){user={phone:fullPhone};sv('user',user);otp=null;document.getElementById('ov').classList.remove('show');renderFlightsUI()}
  else{tries++;lgErr(tries>=5?'tooMany':'badCode')}
}
function logout(){user=null;sv('user',null);document.getElementById('ph').value='';showLogin();go('fly')}
document.getElementById('lang2').onchange=function(e){var s=document.getElementById('lang');s.value=e.target.value;s.onchange({target:s})};

/* ===== Flights ===== */
var CT=[['Kano',12,8.5],['Lagos',6.5,3.4],['Abuja',9.1,7.5],['Niamey',13.5,2.1],['Jeddah',21.5,39.2],['Dubai',25.2,55.3],['Paris',48.9,2.4],['London',51.5,-0.1]];
var fl=null,bk=null,tix=ld('tix',[]);
function km(a,b){var r=Math.PI/180,x=(b[1]-a[1])*r,y=(b[2]-a[2])*r,h=Math.pow(Math.sin(x/2),2)+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.pow(Math.sin(y/2),2);return 12742*Math.asin(Math.sqrt(h))}
function hs(s){var x=0;for(var i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))>>>0;return x}
function pad(n){return (n<10?'0':'')+n}
(function(){var f=document.getElementById('fFrom'),t=document.getElementById('fTo');
  CT.forEach(function(c,i){f.appendChild(new Option(c[0],i));t.appendChild(new Option(c[0],i))});t.value=1;
  var d=document.getElementById('fDate');d.min=new Date().toISOString().slice(0,10);d.value=new Date(Date.now()+864e5).toISOString().slice(0,10)})();
function searchF(){
  var a=+document.getElementById('fFrom').value,b=+document.getElementById('fTo').value,date=document.getElementById('fDate').value,cl=+document.getElementById('fCls').value,px=+document.getElementById('fPax').value;
  bk=null;if(a===b||!date){fl={err:1};renderResults();return}
  var d=km(CT[a],CT[b]),base=45000+d*95,seed=hs(a+'-'+b+date),names=['Sky Gold','Blue Wing','Wine Jet'],deps=[[6,15],[12,40],[19,5]],m=[1,.9,1.15],mins=Math.round(d/800*60+45);
  fl={from:CT[a][0],to:CT[b][0],date:date,cls:cl,pax:px,list:names.map(function(n,i){
    var tot=deps[i][0]*60+deps[i][1]+mins,ar=tot%1440;
    return{air:n,dep:pad(deps[i][0])+':'+pad(deps[i][1]),arr:pad(Math.floor(ar/60))+':'+pad(ar%60),dur:Math.floor(mins/60)+'h '+pad(mins%60)+'m',price:Math.round(base*m[i]*(.95+(seed%10)/100)*(cl?2.6:1)/500)*500}})};
  renderResults();
}
function renderResults(){
  var r=document.getElementById('fRes');r.innerHTML='';if(!fl)return;
  if(fl.err){r.appendChild(el('div','glass',T('same')));return}
  if(bk!==null){var f=fl.list[bk],g=el('div','glass');g.appendChild(el('b','',fl.from+' → '+fl.to+' · '+fl.date+' · '+f.dep));
    var i=document.createElement('input');i.type='text';i.id='bName';i.placeholder=T('name');i.dir='auto';i.style.marginTop='10px';g.appendChild(i);
    var p=el('button','btn',T('pay')+' ₦'+(f.price*fl.pax).toLocaleString());p.style.marginTop='10px';p.onclick=pay;
    var c=el('button','btn ghost',T('cancel'));c.style.marginTop='8px';c.onclick=function(){bk=null;renderResults()};
    g.appendChild(p);g.appendChild(c);r.appendChild(g);return}
  fl.list.forEach(function(f,i){var g=el('div','glass'),row=el('div','fr'),l=el('div');
    l.appendChild(el('b','',f.air));l.appendChild(el('div','sub',f.dep+' → '+f.arr+' · '+f.dur));l.lastChild.style.margin='2px 0 0';
    var pr=el('div','pr','₦'+f.price.toLocaleString());row.appendChild(l);row.appendChild(pr);g.appendChild(row);
    var b=el('button','btn',T('book'));b.style.marginTop='10px';b.onclick=function(){bk=i;renderResults()};g.appendChild(b);r.appendChild(g)});
}
function pay(){
  var nm=document.getElementById('bName').value.trim();if(!nm){document.getElementById('bName').placeholder=T('nameReq');return}
  var f=fl.list[bk],a=new Uint8Array(6);crypto.getRandomValues(a);
  var code='N2-'+Array.prototype.map.call(a,function(x){return 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]}).join('');
  tix.unshift({code:code,from:fl.from,to:fl.to,date:fl.date,dep:f.dep,arr:f.arr,air:f.air,cls:fl.cls,pax:fl.pax,name:nm,price:f.price*fl.pax});
  sv('tix',tix);bk=null;fl=null;renderResults();renderTickets();
}
function renderTickets(){
  var w=document.getElementById('fTix');w.innerHTML='';
  if(!tix.length){w.appendChild(el('p','sub',T('noT')));return}
  tix.forEach(function(t){var c=el('div','bp');c.appendChild(el('div','rt',t.from+' ✈ '+t.to));
    c.appendChild(el('div','sub',t.air+' · '+t.date+' · '+t.dep+' → '+t.arr+' · '+(t.cls?T('biz'):T('eco'))));
    var d=el('div','dl');d.appendChild(el('span','',T('pass')+': '+t.name+' ×'+t.pax));d.appendChild(el('span','',T('code')+': '+t.code));d.appendChild(el('span','','₦'+t.price.toLocaleString()));
    c.appendChild(d);w.appendChild(c)});
}
function renderFlightsUI(){
  var c=document.getElementById('fCls'),v=c.value||'0';c.innerHTML='';c.appendChild(new Option(T('eco'),0));c.appendChild(new Option(T('biz'),1));c.value=v;
  var p=document.getElementById('fPax'),pv=p.value||'1';p.innerHTML='';for(var i=1;i<=5;i++)p.appendChild(new Option(i+' '+T('pax'),i));p.value=pv;
  document.getElementById('lang2').value=lg;rsTxt();
  document.getElementById('outBtn').textContent=(user?user.phone+' · ':'')+T('logout');
  renderResults();renderTickets();
}
if(!user)showLogin();

/* earn */
var earn=ld('earn',0);
function addEarn(n){earn+=n;sv('earn',earn);document.getElementById('coin').textContent='₦'+earn}
document.getElementById('coin').textContent='₦'+earn;

document.getElementById('lang').value=lg;document.getElementById('kbLang').value=kl;
renderChat();renderKeys();applyLang();
</script>
